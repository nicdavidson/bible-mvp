# Dev: same image as prod. Deployed on every push to master (see .github/workflows).
app = "bible-mvp-dev"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "dev"
  DATABASE_PATH = "/data/bible.db"
  # Empty = accounts/sync off. Set these to the dev Supabase project once it exists; never prod's.
  SUPABASE_URL = ""
  SUPABASE_ANON_KEY = ""

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "120s"

[mounts]
  source = "bible_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
